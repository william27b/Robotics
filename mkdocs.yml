# Site config — search for FILL IN and replace before publishing
site_name: "SHP Robotics: Crash Course"
site_description: "Crash courses and team knowledge for our FTC team"
site_url: "https://william27b.github.io/Robotics/"
repo_url: "https://github.com/william27b/Robotics"
repo_name: "edit this site"
# Powers the pencil icon on every page. Must match the default branch — it is `main`,
# and MkDocs would otherwise guess `master` and send students to a 404.
edit_uri: "edit/main/docs/"

theme:
  name: material
  icon:
    logo: material/robot-industrial
    repo: material/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy      # copy button on every code block
    - content.code.annotate  # click-to-expand explanations inside code
    - content.tabs.link      # tab choices sync across the page

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Start here: index.md
  - Programming:
      - Start here: programming/index.md
      - 0 — Just enough Java: programming/0-java-basics.md
      - 1 — How a robot runs code: programming/1-robot-system.md
      - 2 — Your first OpMode: programming/2-first-opmode.md
      - 3 — Driving for real: programming/3-driving.md
      - 4 — Mechanisms and sensors: programming/4-mechanisms.md
      - 5 — Code that survives: programming/5-architecture.md
      - 6 — Autonomous: programming/6-autonomous.md
      - Debugging playbook: programming/debugging.md
      - Practice ladder: programming/ladder.md
  - CAD:
      - Start here: cad/index.md
      - 0 — Setup: cad/0-setup.md
      - 1 — Sketching: cad/1-sketching.md
      - 2 — Sketch to solid: cad/2-solids.md
      - 3 — Assemblies and joints: cad/3-assemblies.md
      - 4 — FTC hardware: cad/4-ftc-hardware.md
      - 5 — Design for 3D printing: cad/5-printing.md
      - Practice ladder: cad/ladder.md
  - Handbook:
      - Code conventions: handbook/code-conventions.md
      - CAD conventions: handbook/cad-conventions.md
      - The team repo: handbook/the-repo.md
      - Competition day: handbook/competition-day.md
      - Resources: handbook/resources.md
  - Contributing:
      - Your first PR: contributing/first-pr.md
      - Style guide: contributing/style-guide.md
